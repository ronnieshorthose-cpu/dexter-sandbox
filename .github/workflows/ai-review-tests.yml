# Runs the automated tests. Unprivileged: read-only token, no secrets, no environment.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AI reviewer tests
        # The result line and any failing test names are also shown as
        # annotations, so the outcome can be read without the full log.
        run: |
          set +e -o pipefail
          python3 -m unittest discover -s .github/ai_review/reviewer_tests -t .github/ai_review -v 2>&1 | tee "$RUNNER_TEMP/ai-review-tests.log"
          status=$?
          grep -E '^(FAIL|ERROR): ' "$RUNNER_TEMP/ai-review-tests.log" | head -50 | sed 's/^/::error title=AI reviewer test::/'
          summary="$(grep -E '^Ran [0-9]+ tests? in ' "$RUNNER_TEMP/ai-review-tests.log" | tail -1) - $(tail -1 "$RUNNER_TEMP/ai-review-tests.log")"
          echo "::notice title=AI reviewer tests::$summary"
          exit $status
      - name: Application tests (if present)
        run: |
          if [ -d tests ]; then
            python3 -m unittest discover -s tests -t . -v
          else
            echo "No application tests on this branch."
          fi
